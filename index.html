    <script>

        let db;
        function initDB() {
            return new Promise((resolve, reject) => {
                const request = indexedDB.open('InteresItDB', 1);
                request.onupgradeneeded = (event) => {
                    db = event.target.result;
                    if (!db.objectStoreNames.contains('settings')) {
                        db.createObjectStore('settings', { keyPath: 'id' });
                    }
                };
                request.onsuccess = (event) => {
                    db = event.target.result;
                    resolve(db);
                };
                request.onerror = (event) => {
                    console.error('IndexedDB error:', event.target.errorCode);
                    reject(event.target.errorCode);
                };
            });
        }

        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        darkBg: '#0f172a',
                        darkCard: '#1e293b'
                    }
                }
            }
        }
    </script>

        /* Lógica Avanzada de Chips: Solo se activa si UN hijo está hovered */
        .chip-group:has(.chip:hover) .chip:not(:hover) {
            transform: scale(0.85);
            opacity: 0.3;
            filter: blur(1px) grayscale(0.8);
        }

        .chip {
            transition: all 0.4s cubic-bezier(0.23, 1, 0.32, 1);
            will-change: transform, opacity;
        }

        .chip:hover {
            transform: scale(1.2) !important;
            opacity: 1 !important;
            filter: blur(0) grayscale(0) !important;
            box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.1), 0 4px 6px -2px rgba(0, 0, 0, 0.05);
            z-index: 20;
        }

        /* Suavizado de la transición de modo oscuro */
        body {
            transition: background-color 0.5s ease, color 0.5s ease;
        }

        /* Soporte para Modo Oscuro en Driver.js */
        html.dark .driver-popover {
            background-color: #1e293b;

            border: 1px solid #334155;

        }
        html.dark .driver-popover-footer button:hover {

    </style>

    <script>
        function toggleDarkMode() {
            document.documentElement.classList.toggle('dark');
            const isDark = document.documentElement.classList.contains('dark');
            document.getElementById('theme-icon').innerText = isDark ? '☀️' : '🌙';
        }

        function adjust(id, amount) {
            const el = document.getElementById(id);
            let val = parseFloat(el.value) || 0;
            el.value = Math.max(0, val + amount);
            renderInversiones();
            calcular();
        }


        let inversiones = [
            { nombre: 'Escenario Conservador', tasa: 0.1, color: 'blue' },
            { nombre: 'Escenario Optimizado', tasa: 3.0, color: 'emerald' }
        ];

        function renderInversiones() {
            const container = document.getElementById('inversionesContainer');
            if (!container) return;

            let html = '';
            inversiones.forEach((inv, index) => {
                html += `
                    <div class="bg-slate-50 dark:bg-darkBg/50 p-4 rounded-2xl border border-transparent transition-all group hover:border-${inv.color}-500/30">
                        <div class="flex justify-between items-center mb-2">
                            <input type="text" value="${inv.nombre}"
                                onchange="updateInversion(${index}, 'nombre', this.value)"
                                class="bg-transparent border-none p-0 text-[10px] font-black uppercase text-${inv.color}-500 focus:ring-0 w-2/3 truncate">
                            ${inversiones.length > 1 ? `
                                <button onclick="removeInversion(${index})" class="text-slate-400 hover:text-red-500 transition-colors opacity-0 group-hover:opacity-100">
                                    <svg class="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
                                        <path stroke-linecap="round" stroke-linejoin="round" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16" />
                                    </svg>
                                </button>
                            ` : ''}
                        </div>
                        <div class="flex items-center gap-2">
                            <input type="number" step="0.1" value="${inv.tasa}"
                                oninput="updateInversion(${index}, 'tasa', this.value)"
                                class="w-full bg-transparent border-none p-0 font-black text-xl focus:ring-0">
                            <span class="text-sm font-bold text-slate-400">%</span>
                        </div>
                    </div>
                `;
            });
            container.innerHTML = html;
        }

        function agregarInversion() {
            if (inversiones.length >= 20) {
                alert("Límite máximo de 20 inversiones alcanzado.");
                return;
            }
            const colors = ['blue', 'emerald', 'purple', 'amber', 'rose', 'cyan'];
            const color = colors[inversiones.length % colors.length];
            inversiones.push({
                nombre: `Escenario ${inversiones.length + 1}`,
                tasa: 1.0,
                color: color
            });
            renderInversiones();
            handleChange();
        }

        function updateInversion(index, field, value) {
            if (field === 'tasa') {
                inversiones[index][field] = parseFloat(value) || 0;
            } else {
                inversiones[index][field] = value;
            }
            handleChange();
        }

        function removeInversion(index) {
            inversiones.splice(index, 1);
            renderInversiones();
            handleChange();
        }

        function calcular() {
            const P = parseFloat(document.getElementById('montoInicial').value) || 0;
            const PMT = parseFloat(document.getElementById('aporteMensual').value) || 0;

            let balances = inversiones.map(() => P);
            let html = '';
            const fmt = new Intl.NumberFormat('en-US', { style: 'currency', currency: 'USD', minimumFractionDigits: 2 });


            const fechaInicioStr = document.getElementById('fechaInicio').value;
            const fechaFinStr = document.getElementById('fechaFin').value;

            if (!fechaInicioStr || !fechaFinStr) return;

            const fechaInicio = new Date(fechaInicioStr + 'T00:00:00');
            const fechaFin = new Date(fechaFinStr + 'T00:00:00');
            const tablaBody = document.getElementById('tablaBody');
            const tablaHeader = document.getElementById('tablaHeader');
            const escenariosContainer = document.getElementById('tour-escenarios');

            if (fechaInicio >= fechaFin) {
                if(tablaBody) tablaBody.innerHTML = '<tr><td colspan="10" class="p-5 text-center text-slate-400 text-xs font-black">La fecha "Desde" debe ser menor a "Hasta".</td></tr>';
                if(escenariosContainer) escenariosContainer.innerHTML = '';
                return;
            }

            const diaCorte = parseInt(document.getElementById('diaCorte').value) || 1;
            const omitirPrimer = document.getElementById('omitirPrimerCorte').checked;

            let current = new Date(fechaInicio);
            let meses = 0;
            let totalPMT = 0;
            let htmlTable = '';

            // Render table header
            if(tablaHeader) {
                let thHtml = '<th class="p-5 text-left">Mes</th>';
                inversiones.forEach((inv, idx) => {
                    const bl = idx > 0 ? 'border-l border-slate-50 dark:border-slate-800' : '';
                    thHtml += `<th class="p-5 text-right ${bl}">${inv.nombre} Bal.</th><th class="p-5 text-right text-${inv.color}-500">${inv.nombre} Int.</th>`;
                });
                tablaHeader.innerHTML = thHtml;
            }

            const aplicarImpuesto = document.getElementById('aplicarImpuesto') ? document.getElementById('aplicarImpuesto').checked : true;

            while (current < fechaFin) {
                let stepEnd = new Date(current.getFullYear(), current.getMonth() + 1, diaCorte);
                if (stepEnd <= current) {
                    stepEnd.setMonth(stepEnd.getMonth() + 1);
                }
                if (stepEnd > fechaFin) stepEnd = fechaFin;

                const days = (stepEnd - current) / (1000 * 60 * 60 * 24);
                let rowHtml = `<td class="p-5 text-left text-xs font-black text-slate-500">${stepEnd.toLocaleDateString('es-ES', { month: 'short', year: '2-digit' }).toUpperCase()}</td>`;

                inversiones.forEach((inv, idx) => {
                    const isFirstMonth = (meses === 0);
                    let isSkipped = false;

                    if (isFirstMonth) {
                        const daysInMonth = new Date(current.getFullYear(), current.getMonth() + 1, 0).getDate();
                        const diasHastaCorte = (stepEnd - current) / (1000 * 60 * 60 * 24);
                        if (omitirPrimer && diasHastaCorte < daysInMonth) {
                            isSkipped = true;
                        }
                    }

                    const rateMensual = (inv.tasa / 100) / 12;
                    let i = 0;

                    if (!isSkipped) {
                        i = balances[idx] * rateMensual * (days / 30.4167);
                        if (aplicarImpuesto) {
                            i = i * 0.90; // Retención 10% RD
                        }
                    }

                    balances[idx] += i;
                    if (meses > 0 || isFirstMonth) {
                        balances[idx] += PMT;
                        if(idx === 0) totalPMT += PMT;
                    }

                    const bl = idx > 0 ? 'border-l border-slate-50 dark:border-slate-800' : '';
                    rowHtml += `<td class="p-5 text-right font-black text-slate-700 dark:text-slate-300 ${bl}">${fmt.format(balances[idx])}</td>`;
                    if (isSkipped) {
                        rowHtml += `<td class="p-5 text-right font-black text-slate-400 italic text-[10px]">Omitido</td>`;
                    } else {
                        rowHtml += `<td class="p-5 text-right font-black text-${inv.color}-500">+${fmt.format(i)}</td>`;
                    }
                });

                meses++;
                htmlTable += `<tr class="hover:bg-slate-50/50 dark:hover:bg-slate-800/40 transition-colors group">${rowHtml}</tr>`;
                current = stepEnd;
            }

            if(tablaBody) tablaBody.innerHTML = htmlTable;

            // Build Escenarios Cards
            const totalInvertido = P + totalPMT;
            if(escenariosContainer) {
                let cardsHtml = '';
                inversiones.forEach((inv, idx) => {
                    const ganancia = balances[idx] - totalInvertido;
                    cardsHtml += `
                    <div class="group">
                        <div class="bg-white dark:bg-darkCard p-8 rounded-[2.5rem] border border-slate-100 dark:border-slate-800 shadow-xl shadow-slate-200/50 dark:shadow-none transition-all hover:border-${inv.color}-500/30">
                            <p class="text-[10px] font-black uppercase text-slate-400 tracking-widest mb-2 truncate">${inv.nombre}</p>
                            <h2 class="text-4xl font-black text-slate-800 dark:text-white">${fmt.format(balances[idx])}</h2>
                            <div class="mt-8 pt-6 border-t border-slate-50 dark:border-slate-800 flex justify-between items-center">
                                <span class="text-[10px] font-black uppercase text-slate-400">Rendimiento Neto</span>
                                <span class="text-xl font-black text-${inv.color}-500">+${fmt.format(ganancia)}</span>
                            </div>
                        </div>
                    </div>
                    `;
                });
                escenariosContainer.innerHTML = cardsHtml;
            }
        }

        function saveSettings() {
            if (!db) return;
            const settings = {
                id: 'current',
                montoInicial: document.getElementById('montoInicial').value,
                aporteMensual: document.getElementById('aporteMensual').value,
                inversiones: inversiones,
                fechaInicio: document.getElementById('fechaInicio').value,
                fechaFin: document.getElementById('fechaFin').value,
                diaCorte: document.getElementById('diaCorte').value,
                omitirPrimerCorte: document.getElementById('omitirPrimerCorte').checked,
                aplicarImpuesto: document.getElementById('aplicarImpuesto') ? document.getElementById('aplicarImpuesto').checked : true,
                isDarkMode: document.documentElement.classList.contains('dark')
            };

            const transaction = db.transaction(['settings'], 'readwrite');
            const store = transaction.objectStore('settings');
            store.put(settings);
        }

        function loadSettings() {
            return new Promise((resolve) => {
                if (!db) { resolve(false); return; }
                const transaction = db.transaction(['settings'], 'readonly');
                const store = transaction.objectStore('settings');
                const request = store.get('current');

                request.onsuccess = (event) => {
                    if (request.result) {
                        const s = request.result;
                        document.getElementById('montoInicial').value = s.montoInicial || 185;
                        document.getElementById('aporteMensual').value = s.aporteMensual || 0;
                        if (s.inversiones && s.inversiones.length > 0) {
                            inversiones = s.inversiones;
                        }
                        renderInversiones();

                        if(s.fechaInicio) document.getElementById('fechaInicio').value = s.fechaInicio;
                        if(s.fechaFin) document.getElementById('fechaFin').value = s.fechaFin;
                        if(s.diaCorte) document.getElementById('diaCorte').value = s.diaCorte;

                        if (!document.getElementById('fechaInicio').value) {
                            const hoy = new Date();
                            document.getElementById('fechaInicio').value = hoy.toISOString().split('T')[0];
                            const mesesDespues = new Date(hoy.getFullYear(), hoy.getMonth() + 7, hoy.getDate());
                            document.getElementById('fechaFin').value = mesesDespues.toISOString().split('T')[0];
                            document.getElementById('diaCorte').value = hoy.getDate();
                        }

                        document.getElementById('omitirPrimerCorte').checked = s.omitirPrimerCorte || false;
                        if (s.hasOwnProperty('aplicarImpuesto') && document.getElementById('aplicarImpuesto')) document.getElementById('aplicarImpuesto').checked = s.aplicarImpuesto;

                        if (s.isDarkMode) {
                            document.documentElement.classList.add('dark');
                            document.getElementById('theme-icon').innerText = '☀️';
                        } else {
                            document.documentElement.classList.remove('dark');
                            document.getElementById('theme-icon').innerText = '🌙';
                        }
                        resolve(true);
                    } else {
                        resolve(false);
                    }
                };
                request.onerror = () => resolve(false);
            });
        }

        // Auto-calculo and save
        function handleChange() {
            calcular();
            saveSettings();
        }

        ['montoInicial', 'aporteMensual', 'fechaInicio', 'fechaFin', 'diaCorte'].forEach(id => {
            const el = document.getElementById(id);
            if (el) el.addEventListener('input', handleChange);
        });

        const omitirCheckbox = document.getElementById('omitirPrimerCorte');
        if(omitirCheckbox) {
            // Remove previous inline onchange to attach standard listener that also saves
            omitirCheckbox.removeAttribute('onchange');
            omitirCheckbox.addEventListener('change', handleChange);
        }

        document.getElementById('fechaInicio').addEventListener('change', (e) => {
            const d = new Date(e.target.value + 'T00:00:00');
            if (!isNaN(d.getDate())) {
                document.getElementById('diaCorte').value = d.getDate();
                handleChange();
            }
        });

        // Modificando toggleDarkMode para que guarde también
        const originalToggleDarkMode = toggleDarkMode;
        window.toggleDarkMode = function() {
            originalToggleDarkMode();
            saveSettings();
        }

        // PWA Service Worker Registration
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('./sw.js').then(registration => {
                    console.log('SW registered: ', registration);
                }).catch(registrationError => {
                    console.log('SW registration failed: ', registrationError);
                });
            });
        }



        async function exportToPDF() {
            const element = document.getElementById('tour-tabla'); // The container with the table
            if (!element) {
                console.error("PDF target element not found.");
                return;
            }

            // Add a temporary class to ensure it's visible or has a white background for the PDF
            element.classList.add('bg-white');

            const opt = {
                margin:       [0.5, 0.5, 0.5, 0.5],
                filename:     'Reporte_Mensual_InteresIt.pdf',
                image:        { type: 'jpeg', quality: 0.98 },
                html2canvas:  { scale: 2, useCORS: true, logging: true },
                jsPDF:        { unit: 'in', format: 'letter', orientation: 'portrait' }
            };

            try {
                await html2pdf().set(opt).from(element).save();
                console.log("PDF exported successfully.");
            } catch (err) {
                console.error("Error exporting PDF:", err);
            } finally {
                element.classList.remove('bg-white');
            }
        }


                window.onload = async () => {
            await initDB();
            const hasSettings = await loadSettings();

            if (!hasSettings) {
                const hoy = new Date();
                const desde = hoy.toISOString().split('T')[0];
                const mesesDespues = new Date(hoy.getFullYear(), hoy.getMonth() + 7, hoy.getDate());
                const hasta = mesesDespues.toISOString().split('T')[0];

                document.getElementById('fechaInicio').value = desde;
                document.getElementById('fechaFin').value = hasta;
                document.getElementById('diaCorte').value = hoy.getDate();
                renderInversiones();
            } else {
                if (!document.getElementById('fechaInicio').value) {
                    const hoy = new Date();
                    document.getElementById('fechaInicio').value = hoy.toISOString().split('T')[0];
                    const mesesDespues = new Date(hoy.getFullYear(), hoy.getMonth() + 7, hoy.getDate());
                    document.getElementById('fechaFin').value = mesesDespues.toISOString().split('T')[0];
                    document.getElementById('diaCorte').value = hoy.getDate();
                }
            }

            // Fallback in case renderInversiones was not called somehow
            if (document.getElementById('inversionesContainer') && document.getElementById('inversionesContainer').innerHTML.trim() === '') {
                renderInversiones();
            }

            calcular();

            // 1. Instanciar la librería
            const driver = window.driver.js.driver;
        
            // 2. Configurar los pasos del tour
            const tour = driver({
                showProgress: true,
                animate: true,
                nextBtnText: 'Siguiente',
                prevBtnText: 'Atrás',
                doneBtnText: 'Entendido',
                steps: [
                    { element: '#tour-intro', popover: { title: 'Bienvenido a InteresIt', description: 'Esta plataforma evalúa el crecimiento de tu capital proyectándolo con precisión a través del tiempo.', side: "bottom", align: 'start' }},
                    { element: '#tour-data', popover: { title: 'Datos de Inversión', description: 'Aquí defines tu Capital Inicial, tu Ahorro Mensual, y ajustas las tasas y fechas con tu Día de Corte bancario.', side: "right", align: 'start' }},
                    { element: '#tour-escenarios', popover: { title: 'Compara Estrategias', description: 'Observa de un solo vistazo el rendimiento neto de tus dos diferentes escenarios en tiempo real.', side: "top", align: 'start' }},
                    { element: '#tour-tabla', popover: { title: 'Reporte Mensual', description: 'Analiza la evolución de tu saldo e intereses, calculados exactamente según los días reales de tu proyección. ¡Estás listo!', side: "top", align: 'start' }}
                ]
            });
        
            // 3. Disparar el tour al hacer clic en el botón de ayuda
            document.getElementById('btn-ayuda').addEventListener('click', () => {
                tour.drive();
            });
        };
    </script>
