<!DOCTYPE html>
<html lang="es" class="">

<head>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/driver.js@latest/dist/driver.css" />
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>InteresIt</title>
    <link rel="icon" type="image/webp" href="./imgs/app_logo.webp">
    <link rel="manifest" href="./manifest.json">
    <meta name="theme-color" content="#3b82f6">
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        darkBg: '#0f172a',
                        darkCard: '#1e293b'
                    }
                }
            }
        }
    </script>
    <style>
        /* Lógica Avanzada de Chips: Solo se activa si UN hijo está hovered */
        .chip-group:has(.chip:hover) .chip:not(:hover) {
            transform: scale(0.85);
            opacity: 0.3;
            filter: blur(1px) grayscale(0.8);
        }

        .chip {
            transition: all 0.4s cubic-bezier(0.23, 1, 0.32, 1);
            will-change: transform, opacity;
        }

        .chip:hover {
            transform: scale(1.2) !important;
            opacity: 1 !important;
            filter: blur(0) grayscale(0) !important;
            box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.1), 0 4px 6px -2px rgba(0, 0, 0, 0.05);
            z-index: 20;
        }

        /* Suavizado de la transición de modo oscuro */
        body {
            transition: background-color 0.5s ease, color 0.5s ease;
        }

        /* Soporte para Modo Oscuro en Driver.js */
        html.dark .driver-popover {
            background-color: #1e293b;
            color: #f1f5f9;
            border: 1px solid #334155;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
        }
        html.dark .driver-popover-title {
            color: #ffffff;
            font-weight: 900;
        }
        html.dark .driver-popover-description {
            color: #94a3b8;
        }
        html.dark .driver-popover-footer button {
            background-color: #0f172a;
            color: #3b82f6;
            border: 1px solid #1e293b;
            text-shadow: none;
        }
        html.dark .driver-popover-footer button:hover {
            background-color: #3b82f6;
            color: white;
        }
    </style>
</head>

<body class="bg-slate-50 dark:bg-darkBg text-slate-900 dark:text-slate-100 min-h-screen">

    <div class="max-w-6xl mx-auto p-4 md:p-8">
        <header id="tour-intro" class="flex justify-between items-center mb-10">
            <div class="flex items-center gap-4">
                <img src="./imgs/app_logo.webp" alt="InteresIt Logo" class="h-12 w-12 object-contain rounded-xl">
                <div>
                    <h1 class="text-3xl font-black tracking-tighter italic">
                        Interes<span class="text-blue-600 text-4xl">It</span>
                    </h1>
                    <p class="text-slate-500 dark:text-slate-400 text-[10px] font-black tracking-[0.3em] uppercase">
                        Terminal Financiera</p>
                </div>
            </div>
            <div class="flex items-center gap-3">
                <button id="btn-ayuda" class="group px-4 py-3 rounded-2xl bg-blue-50 dark:bg-blue-500/10 text-blue-600 dark:text-blue-400 font-bold shadow-sm hover:shadow-blue-500/20 transition-all border border-blue-200 dark:border-blue-800/50">
                    <span class="text-xs uppercase tracking-wider">Tutorial</span>
                </button>
                <button onclick="toggleDarkMode()"
                    class="group p-3 rounded-2xl bg-white dark:bg-darkCard shadow-sm hover:shadow-blue-500/20 transition-all border border-slate-200 dark:border-slate-800">
                    <span id="theme-icon" class="text-xl group-hover:rotate-12 block transition-transform">🌙</span>
                </button>
            </div>
        </header>

        <div class="grid grid-cols-1 lg:grid-cols-12 gap-8">
            <aside class="lg:col-span-4 space-y-6">
                <div id="tour-data"
                    class="bg-white dark:bg-darkCard p-7 rounded-[2.5rem] shadow-2xl shadow-slate-200/60 dark:shadow-none border border-slate-100 dark:border-slate-800/50">
                    <h2 class="text-[11px] font-black uppercase tracking-widest text-slate-400 mb-8 flex items-center">
                        <span class="w-3 h-[2px] bg-blue-600 mr-2"></span> Data Entry
                    </h2>

                    <div class="space-y-9">
                        <div>
                            <label class="block text-[10px] font-black uppercase text-slate-400 mb-3 ml-1">Capital
                                Inicial ($)</label>
                            <input type="number" id="montoInicial" value="185"
                                class="w-full bg-slate-50 dark:bg-darkBg/50 p-4 rounded-2xl border border-transparent focus:border-blue-500/50 focus:ring-0 text-3xl font-black transition-all">

                            <div class="flex flex-wrap gap-2 mt-5 chip-group">
                                <button onclick="adjust('montoInicial', -100)"
                                    class="chip px-3 py-1.5 text-[10px] font-black rounded-lg bg-red-50 text-red-500 dark:bg-red-500/10 dark:text-red-400 border border-red-100 dark:border-red-500/20">-100</button>
                                <button onclick="adjust('montoInicial', -50)"
                                    class="chip px-3 py-1.5 text-[10px] font-black rounded-lg bg-red-50 text-red-500 dark:bg-red-500/10 dark:text-red-400 border border-red-100 dark:border-red-500/20">-50</button>
                                <button onclick="adjust('montoInicial', -20)"
                                    class="chip px-3 py-1.5 text-[10px] font-black rounded-lg bg-red-50 text-red-500 dark:bg-red-500/10 dark:text-red-400 border border-red-100 dark:border-red-500/20">-20</button>
                                <button onclick="adjust('montoInicial', 20)"
                                    class="chip px-3 py-1.5 text-[10px] font-black rounded-lg bg-emerald-50 text-emerald-500 dark:bg-emerald-500/10 dark:text-emerald-400 border border-emerald-100 dark:border-emerald-500/20">+20</button>
                                <button onclick="adjust('montoInicial', 50)"
                                    class="chip px-3 py-1.5 text-[10px] font-black rounded-lg bg-emerald-50 text-emerald-500 dark:bg-emerald-500/10 dark:text-emerald-400 border border-emerald-100 dark:border-emerald-500/20">+50</button>
                                <button onclick="adjust('montoInicial', 100)"
                                    class="chip px-3 py-1.5 text-[10px] font-black rounded-lg bg-emerald-50 text-emerald-500 dark:bg-emerald-500/10 dark:text-emerald-400 border border-emerald-100 dark:border-emerald-500/20">+100</button>
                            </div>
                        </div>

                        <div>
                            <label class="block text-[10px] font-black uppercase text-slate-400 mb-3 ml-1">Aporte
                                Mensual ($)</label>
                            <input type="number" id="aporteMensual" value="0"

                            <div class="flex flex-wrap gap-2 mt-5 chip-group">
                                <button onclick="adjust('aporteMensual', -100)"

                                <button onclick="adjust('aporteMensual', -50)"
                                    class="chip px-3 py-1.5 text-[10px] font-black rounded-lg bg-red-50 text-red-500 dark:bg-red-500/10 dark:text-red-400 border border-red-100 dark:border-red-500/20">-50</button>
                                <button onclick="adjust('aporteMensual', -20)"

                                <button onclick="adjust('aporteMensual', 20)"

                                <button onclick="adjust('aporteMensual', 50)"

                                <button onclick="adjust('aporteMensual', 100)"
                                    class="chip px-3 py-1.5 text-[10px] font-black rounded-lg bg-blue-50 text-blue-500 dark:bg-blue-500/10 dark:text-blue-400 border border-blue-100 dark:border-blue-500/20">+100</button>
                            </div>

                                    <label

                                    <input type="date" id="fechaInicio"

                                <input type="number" id="diaCorte" min="1" max="31" value="1"

                                <label class="flex items-center gap-2 mt-4 cursor-pointer group">

                                        <svg class="absolute w-2.5 h-2.5 text-white opacity-0 peer-checked:opacity-100 transition-opacity pointer-events-none"
                                            fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="3">

                                        <svg class="absolute w-2.5 h-2.5 text-white opacity-0 peer-checked:opacity-100 transition-opacity pointer-events-none"
                                            fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="3">
                                            <path stroke-linecap="round" stroke-linejoin="round" d="M5 13l4 4L19 7" />
                                        </svg>

            <main class="lg:col-span-8 space-y-6">

                        <h3 class="font-black text-[11px] uppercase tracking-[0.2em] text-slate-500">Proyección de
                            Capitalización Mensual</h3>
                    </div>
                    <div class="overflow-x-auto">
                        <table class="w-full">
                            <thead>

                                <tr id="tablaHeaders" class="text-[9px] font-black uppercase text-slate-400 border-b border-slate-50 dark:border-slate-800">
                                    <!-- Dynamic headers will go here -->
                                </tr>
                            </thead>
                            <tbody id="tablaBody" class="divide-y divide-slate-50 dark:divide-slate-800/50">

    <script src="https://cdn.jsdelivr.net/npm/driver.js@latest/dist/driver.js.iife.js"></script>

    <script>
        function toggleDarkMode() {
            document.documentElement.classList.toggle('dark');
            const isDark = document.documentElement.classList.contains('dark');
            document.getElementById('theme-icon').innerText = isDark ? '☀️' : '🌙';
        }

        function adjust(id, amount) {
            const el = document.getElementById(id);
            let val = parseFloat(el.value) || 0;
            el.value = Math.max(0, val + amount);
            renderInversiones();
            calcular();
        }


        let inversiones = [
            { id: 'inv_1', nombre: 'Escenario Conservador', tasa: 0.1 },
            { id: 'inv_2', nombre: 'Escenario Optimizado', tasa: 3.0 }
        ];

        function renderInversiones() {
            const container = document.getElementById('inversionesContainer');
            if(!container) return;
            let html = '';
            inversiones.forEach((inv, index) => {
                html += `
                    <div class="bg-slate-50 dark:bg-darkBg/50 p-4 rounded-2xl relative group">
                        <div class="flex justify-between items-center mb-2">
                            <input type="text" value="${inv.nombre}" onchange="updateInversion('${inv.id}', 'nombre', this.value)" class="bg-transparent border-none p-0 text-[10px] font-black uppercase text-slate-500 w-full focus:ring-0">
                            ${inversiones.length > 1 ? `<button onclick="eliminarInversion('${inv.id}')" class="text-red-400 hover:text-red-500 opacity-0 group-hover:opacity-100 transition-opacity"><svg class="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path></svg></button>` : ''}
                        </div>
                        <div class="flex items-center gap-2">
                            <input type="number" step="0.1" value="${inv.tasa}" oninput="updateInversion('${inv.id}', 'tasa', this.value)" class="w-full bg-transparent border-none p-0 font-black text-xl text-slate-800 dark:text-white focus:ring-0">
                            <span class="text-xs font-black text-slate-400">%</span>
                        </div>
                    </div>
                `;
            });
            container.innerHTML = html;
        }

        function agregarInversion() {
            if(inversiones.length >= 20) return alert('Máximo 20 inversiones permitidas.');
            const id = 'inv_' + Date.now();
            inversiones.push({ id, nombre: 'Nueva Inversión', tasa: 5.0 });
            renderInversiones();
            handleChange();
        }

        function updateInversion(id, field, value) {
            const inv = inversiones.find(i => i.id === id);
            if(inv) {
                if(field === 'tasa') inv[field] = parseFloat(value) || 0;
                else inv[field] = value;
                handleChange();
            }
        }

        function eliminarInversion(id) {
            inversiones = inversiones.filter(i => i.id !== id);
            renderInversiones();
            handleChange();
        }

        // We completely replace the calcular function
function calcular() {
            const P = parseFloat(document.getElementById('montoInicial').value) || 0;
            const PMT = parseFloat(document.getElementById('aporteMensual').value) || 0;
            const aplicarImpuesto = document.getElementById('aplicarImpuesto') ? document.getElementById('aplicarImpuesto').checked : true;

            const fmt = new Intl.NumberFormat('en-US', { style: 'currency', currency: 'USD', minimumFractionDigits: 2 });
            const fechaInicioStr = document.getElementById('fechaInicio').value;
            const fechaFinStr = document.getElementById('fechaFin').value;

            if (!fechaInicioStr || !fechaFinStr) return;

            const fechaInicio = new Date(fechaInicioStr + 'T00:00:00');
            const fechaFin = new Date(fechaFinStr + 'T00:00:00');
            const tablaBody = document.getElementById('tablaBody');
            const tablaHeaders = document.getElementById('tablaHeaders');
            const escenariosContainer = document.getElementById('tour-escenarios');

            if (fechaInicio >= fechaFin) {
                if(tablaBody) tablaBody.innerHTML = '<tr><td colspan="100%" class="p-5 text-center text-slate-400 text-xs font-black">La fecha "Desde" debe ser menor a "Hasta".</td></tr>';
                if(escenariosContainer) escenariosContainer.innerHTML = '';
                return;
            }

            // Headers for table
            let headersHtml = '<th class="p-5 text-left">Mes</th>';
            inversiones.forEach(inv => {
                headersHtml += `<th class="p-5 text-right border-l border-slate-50 dark:border-slate-800">${inv.nombre} <br><span class="opacity-50">Balance</span></th>`;
                headersHtml += `<th class="p-5 text-right">${inv.nombre} <br><span class="opacity-50">Int.</span></th>`;
            });
            if(tablaHeaders) tablaHeaders.innerHTML = headersHtml;

            const mesesNombres = ['ENE', 'FEB', 'MAR', 'ABR', 'MAY', 'JUN', 'JUL', 'AGO', 'SEP', 'OCT', 'NOV', 'DIC'];
            let current = new Date(fechaInicio);
            let totalPMT = 0;

            const cutDay = parseInt(document.getElementById('diaCorte').value) || 1;
            const omitirPrimerCorteCheckbox = document.getElementById('omitirPrimerCorte');
            const omitirPrimerCorte = omitirPrimerCorteCheckbox ? omitirPrimerCorteCheckbox.checked : false;

            // Initialize balances
            let balances = inversiones.map(() => P);
            let htmlTable = '';

            while (current < fechaFin) {
                const year = current.getFullYear();
                const month = current.getMonth();
                const daysInYear = (year % 4 === 0 && year % 100 !== 0) || (year % 400 === 0) ? 366 : 365;
                const isFirstIteration = (current.getTime() === fechaInicio.getTime());

                let thisMonthCutDay = Math.min(cutDay, new Date(year, month + 1, 0).getDate());
                let thisMonthCut = new Date(year, month, thisMonthCutDay);

                let nextStepEnd;
                if (current < thisMonthCut && !(isFirstIteration && omitirPrimerCorte)) {
                    nextStepEnd = thisMonthCut;
                } else {
                    let nextMonthCutDay = Math.min(cutDay, new Date(year, month + 2, 0).getDate());
                    nextStepEnd = new Date(year, month + 1, nextMonthCutDay);
                }

                const stepEnd = nextStepEnd < fechaFin ? nextStepEnd : fechaFin;
                const daysInPeriod = Math.round((stepEnd - current) / (1000 * 60 * 60 * 24));

                let displayDate = new Date(stepEnd.getTime() - 1);
                const nombreMes = `${mesesNombres[displayDate.getMonth()]} ${displayDate.getFullYear()}`;

                const totalDaysInMonth = new Date(displayDate.getFullYear(), displayDate.getMonth() + 1, 0).getDate();
                const proporcionMes = daysInPeriod / totalDaysInMonth;
                const aporteProporcional = PMT * proporcionMes;

                totalPMT += aporteProporcional;

                let rowHtml = `<td class="p-5 text-slate-400 font-black italic whitespace-nowrap">${nombreMes} <span class="text-[9px] opacity-60 font-normal ml-1">(${daysInPeriod}d)</span></td>`;

                inversiones.forEach((inv, idx) => {
                    let tasaAnual = inv.tasa / 100;
                    let interesGanado = balances[idx] * (tasaAnual / daysInYear) * daysInPeriod;

                    // Lógica de Impuestos (Retención del 10% por ley RD)
                    if (aplicarImpuesto && interesGanado > 0) {
                        interesGanado = interesGanado * 0.90; // Retiene el 10%
                    }

                    balances[idx] += interesGanado + aporteProporcional;

                    rowHtml += `<td class="p-5 text-right font-black border-l border-slate-50 dark:border-slate-800">${fmt.format(balances[idx])}</td>`;
                    rowHtml += `<td class="p-5 text-right text-blue-500/80 font-black">+${fmt.format(interesGanado)}</td>`;
                });

                htmlTable += `<tr class="text-xs font-bold hover:bg-slate-50 dark:hover:bg-slate-800/40 transition-colors group">${rowHtml}</tr>`;
                current = stepEnd;
            }

            if(tablaBody) tablaBody.innerHTML = htmlTable;

            // Build Escenarios Cards
            const totalInvertido = P + totalPMT;
            if(escenariosContainer) {
                let cardsHtml = '';
                const colors = ['blue', 'emerald', 'purple', 'amber', 'rose', 'cyan'];
                inversiones.forEach((inv, idx) => {
                    const c = colors[idx % colors.length];
                    const ganancia = balances[idx] - totalInvertido;
                    cardsHtml += `
                    <div class="group">
                        <div class="bg-white dark:bg-darkCard p-8 rounded-[2.5rem] border border-slate-100 dark:border-slate-800 shadow-xl shadow-slate-200/50 dark:shadow-none transition-all hover:border-${c}-500/30">
                            <p class="text-[10px] font-black uppercase text-slate-400 tracking-widest mb-2 truncate">${inv.nombre}</p>
                            <h2 class="text-4xl font-black text-slate-800 dark:text-white">${fmt.format(balances[idx])}</h2>
                            <div class="mt-8 pt-6 border-t border-slate-50 dark:border-slate-800 flex justify-between items-center">
                                <span class="text-[10px] font-black uppercase text-slate-400">Rendimiento Neto</span>
                                <span class="text-xl font-black text-${c}-500">+${fmt.format(ganancia)}</span>
                            </div>
                        </div>
                    </div>
                    `;
                });
                escenariosContainer.innerHTML = cardsHtml;
            }
        }

        // IndexedDB Manager
        const dbName = 'InteresItDB';
        const dbVersion = 1;
        let db;

        function initDB() {
            return new Promise((resolve, reject) => {
                const request = indexedDB.open(dbName, dbVersion);

                request.onerror = (event) => {
                    console.error("Database error:", event.target.error);
                    reject(event.target.error);
                };

                request.onsuccess = (event) => {
                    db = event.target.result;
                    resolve(db);
                };

                request.onupgradeneeded = (event) => {
                    db = event.target.result;
                    if (!db.objectStoreNames.contains('settings')) {
                        db.createObjectStore('settings', { keyPath: 'id' });
                    }
                };
            });
        }

        function saveSettings() {
            if (!db) return;
            const settings = {
                id: 'current',
                montoInicial: document.getElementById('montoInicial').value,
                aporteMensual: document.getElementById('aporteMensual').value,
                inversiones: inversiones,
                aplicarImpuesto: document.getElementById('aplicarImpuesto') ? document.getElementById('aplicarImpuesto').checked : true,
                fechaInicio: document.getElementById('fechaInicio').value,
                fechaFin: document.getElementById('fechaFin').value,
                diaCorte: document.getElementById('diaCorte').value,
                omitirPrimerCorte: document.getElementById('omitirPrimerCorte').checked,
                isDarkMode: document.documentElement.classList.contains('dark')
            };

            const transaction = db.transaction(['settings'], 'readwrite');
            const store = transaction.objectStore('settings');
            store.put(settings);
        }

        function loadSettings() {
            return new Promise((resolve) => {
                if (!db) { resolve(false); return; }
                const transaction = db.transaction(['settings'], 'readonly');
                const store = transaction.objectStore('settings');
                const request = store.get('current');

                request.onsuccess = (event) => {
                    if (request.result) {
                        const s = request.result;
                        document.getElementById('montoInicial').value = s.montoInicial || 185;
                        document.getElementById('aporteMensual').value = s.aporteMensual || 0;

                        if(s.inversiones && s.inversiones.length > 0) {
                            inversiones = s.inversiones;
                        }
                        if(s.aplicarImpuesto !== undefined && document.getElementById('aplicarImpuesto')) {
                            document.getElementById('aplicarImpuesto').checked = s.aplicarImpuesto;
                        }
                        renderInversiones();

                        if(s.fechaInicio) document.getElementById('fechaInicio').value = s.fechaInicio;
                        if(s.fechaFin) document.getElementById('fechaFin').value = s.fechaFin;
                        if(s.diaCorte) document.getElementById('diaCorte').value = s.diaCorte;
                        document.getElementById('omitirPrimerCorte').checked = s.omitirPrimerCorte || false;

                        if (s.isDarkMode) {
                            document.documentElement.classList.add('dark');
                            document.getElementById('theme-icon').innerText = '☀️';
                        } else {
                            document.documentElement.classList.remove('dark');
                            document.getElementById('theme-icon').innerText = '🌙';
                        }
                        resolve(true);
                    } else {
                        resolve(false);
                    }
                };
                request.onerror = () => resolve(false);
            });
        }

        // Auto-calculo and save
        function handleChange() {
            calcular();
            saveSettings();
        }

        ['montoInicial', 'aporteMensual', 'interes1', 'interes2', 'fechaInicio', 'fechaFin', 'diaCorte'].forEach(id => {
            const el = document.getElementById(id);
            if (el) el.addEventListener('input', handleChange);
        });

        const omitirCheckbox = document.getElementById('omitirPrimerCorte');
        if(omitirCheckbox) {
            // Remove previous inline onchange to attach standard listener that also saves
            omitirCheckbox.removeAttribute('onchange');
            omitirCheckbox.addEventListener('change', handleChange);
        }

        document.getElementById('fechaInicio').addEventListener('change', (e) => {
            const d = new Date(e.target.value + 'T00:00:00');
            if (!isNaN(d.getDate())) {
                document.getElementById('diaCorte').value = d.getDate();
                handleChange();
            }
        });

        // Modificando toggleDarkMode para que guarde también
        const originalToggleDarkMode = toggleDarkMode;
        window.toggleDarkMode = function() {
            originalToggleDarkMode();
            saveSettings();
        }

        // PWA Service Worker Registration
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('./sw.js').then(registration => {
                    console.log('SW registered: ', registration);
                }).catch(registrationError => {
                    console.log('SW registration failed: ', registrationError);
                });
            });
        }

        window.onload = async () => {
            await initDB();
            const hasSettings = await loadSettings();

            if (!hasSettings) {
                const hoy = new Date();
                const desde = hoy.toISOString().split('T')[0];
                const mesesDespues = new Date(hoy.getFullYear(), hoy.getMonth() + 7, hoy.getDate());
                const hasta = mesesDespues.toISOString().split('T')[0];

                document.getElementById('fechaInicio').value = desde;
                document.getElementById('fechaFin').value = hasta;
                document.getElementById('diaCorte').value = hoy.getDate();
            }

            calcular();

            // 1. Instanciar la librería
            const driver = window.driver.js.driver;
        
            // 2. Configurar los pasos del tour
            const tour = driver({
                showProgress: true,
                animate: true,
                nextBtnText: 'Siguiente',
                prevBtnText: 'Atrás',
                doneBtnText: 'Entendido',
                steps: [
                    { element: '#tour-intro', popover: { title: 'Bienvenido a InteresIt', description: 'Esta plataforma evalúa el crecimiento de tu capital proyectándolo con precisión a través del tiempo.', side: "bottom", align: 'start' }},
                    { element: '#tour-data', popover: { title: 'Datos de Inversión', description: 'Aquí defines tu Capital Inicial, tu Ahorro Mensual, y ajustas las tasas y fechas con tu Día de Corte bancario.', side: "right", align: 'start' }},
                    { element: '#tour-escenarios', popover: { title: 'Compara Estrategias', description: 'Observa de un solo vistazo el rendimiento neto de tus dos diferentes escenarios en tiempo real.', side: "top", align: 'start' }},
                    { element: '#tour-tabla', popover: { title: 'Reporte Mensual', description: 'Analiza la evolución de tu saldo e intereses, calculados exactamente según los días reales de tu proyección. ¡Estás listo!', side: "top", align: 'start' }}
                ]
            });
        
            // 3. Disparar el tour al hacer clic en el botón de ayuda
            document.getElementById('btn-ayuda').addEventListener('click', () => {
                tour.drive();
            });
        };
    </script>
</body>

</html>
