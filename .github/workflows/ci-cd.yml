name: CI/CD Pipeline

on:
  push:
    branches: ["main", "develop"]
  pull_request:
    branches: ["main", "develop"]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read

env:
  CI: 'true'

jobs:
  quality-gate:
    name: Lint, Test & Quality Gate (Node 24)
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      # Reads exact pnpm version from package.json -> packageManager (pnpm@11.24.0)
      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'pnpm'

      - name: Install Dependencies
        run: pnpm install --frozen-lockfile

      - name: Verify Line Limits (Max 600, Alert 450)
        run: pnpm check:lines

      - name: Svelte Diagnostics & Strict TypeScript Check
        run: pnpm check

      - name: Execute Vitest Suite
        run: pnpm test

      - name: Build Static Production SPA
        run: pnpm run build

  e2e-tests:
    name: Playwright E2E Suite (Node 24)
    needs: quality-gate
    # Runs on main pushes, PRs to main, or manual dispatch to ensure fast feedback on develop
    if: github.ref == 'refs/heads/main' || (github.event_name == 'pull_request' && github.base_ref == 'main') || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'pnpm'

      - name: Install Dependencies
        run: pnpm install --frozen-lockfile

      - name: Build Static Production SPA
        run: pnpm run build

      - name: Install Playwright Browsers
        run: pnpm exec playwright install --with-deps chromium

      - name: Execute Playwright E2E Suite
        run: pnpm run test:e2e

      - name: Upload Playwright Evidence Report
        uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 2
          if-no-files-found: ignore
          overwrite: true

      - name: Upload Playwright Test Results & Traces
        uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: playwright-test-results
          path: test-results/
          retention-days: 2
          if-no-files-found: ignore
          overwrite: true

  deploy-pages:
    name: Deploy to GitHub Pages
    needs: e2e-tests
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    permissions:
      contents: read
      pages: write
      id-token: write
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'pnpm'

      - name: Install Dependencies
        run: pnpm install --frozen-lockfile

      - name: Setup GitHub Pages Environment
        id: pages
        uses: actions/configure-pages@v5

      - name: Build Static Production Site
        env:
          BASE_PATH: ${{ steps.pages.outputs.base_path }}
        run: pnpm run build

      - name: Upload Pages Artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: 'build'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

  deploy-staging:
    name: Package Staging Preview
    needs: quality-gate
    if: github.ref == 'refs/heads/develop' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    environment:
      name: development
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'pnpm'

      - name: Install Dependencies
        run: pnpm install --frozen-lockfile

      - name: Build Static Staging Site
        env:
          BASE_PATH: '/InteresItWeb/dev'
        run: pnpm run build

      - name: Upload Staging Artifact
        uses: actions/upload-artifact@v4
        with:
          name: staging-preview-build
          path: build/
          retention-days: 14
          overwrite: true
