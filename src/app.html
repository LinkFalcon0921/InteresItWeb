<!doctype html>
<html lang="es">
	<head>
		<meta charset="utf-8" />
		<title>InteresIt — Terminal Financiera Multi-Escenario</title>
		<meta name="description" content="Terminal financiera y simulador de interés compuesto multi-escenario con cortes bancarios exactos y retención fiscal de República Dominicana." />
		<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
		<meta name="theme-color" content="#004851" />
		<meta name="color-scheme" content="light dark" />

		<!-- Iconos y Manifest PWA -->
		<link rel="icon" type="image/webp" href="%sveltekit.assets%/imgs/app_logo.webp" />
		<link rel="apple-touch-icon" href="%sveltekit.assets%/imgs/app_logo.webp" />
		<link rel="manifest" href="%sveltekit.assets%/manifest.json" />

		<!-- OpenGraph / Social -->
		<meta property="og:type" content="website" />
		<meta property="og:title" content="InteresIt — Terminal Financiera Multi-Escenario" />
		<meta property="og:description" content="Simula y compara hasta 20 instrumentos de inversión con cortes bancarios exactos y retención fiscal del 10% RD." />
		<meta property="og:image" content="%sveltekit.assets%/imgs/app_logo.png" />

		<!-- Hojas de Estilos SMUI Precompiladas -->
		<link rel="stylesheet" href="%sveltekit.assets%/smui.css" media="(prefers-color-scheme: light)" />
		<link rel="stylesheet" href="%sveltekit.assets%/smui-dark.css" media="screen and (prefers-color-scheme: dark)" />

		%sveltekit.head%
	</head>
	<body data-sveltekit-preload-data="hover">
		<div style="display: contents">%sveltekit.body%</div>
	</body>
</html>
